name: Test Publish to TestPyPI

on:
  workflow_dispatch: # Manual trigger only
    inputs:
      test_version:
        description: "Test version (e.g., 0.1.0-test1)"
        required: true
        default: "0.1.0-test1"

jobs:
  test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Update version for testing
        run: |
          sed -i "s/version = \".*\"/version = \"${{ github.event.inputs.test_version }}\"/" pyproject.toml
          sed -i "s/name = \".*\"/name = \"streamlit-state-manager-test\"/" pyproject.toml

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to TestPyPI
        run: |
          python -m build
          twine upload --repository-url testpypi dist/*

      - name: Test installation
        run: |
          sleep 30  # Wait for TestPyPI to process
          pip install -i https://test.pypi.org/simple/ streamlit-state-manager-test==${{ github.event.inputs.test_version }}
